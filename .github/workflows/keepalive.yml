name: keep-alive
# Mantiene despierto el backend en Render (el plan free duerme tras ~15 min sin uso).
# Corre en los servidores de GitHub (no depende del computador del CEO).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 https://evidentra-backend.onrender.com/api/v1/health || echo 000)
            echo "intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 25
          done
          echo "Backend no respondió 200 (puede estar despertando). Best-effort."
          exit 0
